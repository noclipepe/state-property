<head>

<meta property="og:site_name" content="STATE PROPERTY">
<meta property="og:title" content="STATE PROPERTY · Choose your POV">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{pageUrl}}">

<meta name="twitter:title" content="STATE PROPERTY · Choose your POV">

<link rel="icon" href="assets/brand/favicon.ico" sizes="any">

<body class="hub-page">
<!-- The STATE PROPERTY series menu: no 3D here; each game loads on its own page once chosen. -->
<main class="hub brand">
  <header class="hub-head">
    <h1 class="hub-title">STATE PROPERTY</h1>
    <p class="hub-by"><img src="assets/brand/avatar-160.webp" alt="" width="22" height="22">by @noclipepe</p>
    <p class="hub-choose">Choose your POV</p>
  </header>

  <!-- The token's contract address, filled from SITE.token: tap the address or COPY to copy it. -->
  <section id="token" class="token" aria-label="Token contract address">
    <div class="token-head">
      <span class="token-chain"><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M4.4 14.6a.8.8 0 0 1 .6-.2h18.3c.4 0 .6.4.3.7l-3.6 3.6a.8.8 0 0 1-.6.3H1.1c-.4 0-.6-.5-.3-.8zm0-13.3A.8.8 0 0 1 5 1h18.3c.4 0 .6.5.3.8l-3.6 3.6a.8.8 0 0 1-.6.3H1.1c-.4 0-.6-.5-.3-.8zm15.2 6.6a.8.8 0 0 0-.6-.3H.7c-.4 0-.6.5-.3.8L4 12a.8.8 0 0 0 .6.3h18.3c.4 0 .6-.5.3-.8z"/></svg>SOLANA</span>
      <h2 class="token-title">OFFICIAL TOKEN</h2>
    </div>
    <button id="copy-ca" class="token-ca" type="button" aria-describedby="copy-ca-status">
      <span class="token-ca-tag">CA</span>
      <code id="token-ca"></code>
      <span class="token-copy"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-copy" d="M8 7V4.5A1.5 1.5 0 0 1 9.5 3h10A1.5 1.5 0 0 1 21 4.5v10a1.5 1.5 0 0 1-1.5 1.5H17v2.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7zm2 0h5.5A1.5 1.5 0 0 1 17 8.5V14h2V5h-9zM6 9v9h9V9z"/><path class="i-done" d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 11-11-1.4-1.4z"/></svg><span id="copy-ca-label">COPY CA</span></span>
    </button>
    <p id="copy-ca-status" class="token-status" role="status">Tap the address to copy</p>
    <div class="token-links">
      <a id="token-buy" class="token-btn buy" target="_blank" rel="noopener">BUY</a>
      <a id="token-chart" class="token-btn" target="_blank" rel="noopener">CHART</a>
    </div>
  </section>

  <section id="games" class="cards" aria-label="Games"></section>

  <section class="social" aria-label="New games and updates">
    <p class="social-title">NEW GAMES &amp; UPDATES</p>
    <div class="social-btns">
      <a class="social-btn" data-link="instagram" href="{{instagram}}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21 8.2c-.1-1.7-.4-3.2-1.7-4.4C18 2.5 16.5 2.2 14.8 2.1 13.1 2 10.9 2 9.2 2.1 7.5 2.2 6 2.5 4.8 3.8 3.5 5 3.2 6.5 3.1 8.2 3 9.9 3 14.1 3.1 15.8c.1 1.7.4 3.2 1.7 4.4 1.2 1.3 2.7 1.6 4.4 1.7 1.7.1 3.9.1 5.6 0 1.7-.1 3.2-.4 4.4-1.7 1.3-1.2 1.6-2.7 1.7-4.4.1-1.7.1-5.9 0-7.6zM19 18.6a2.9 2.9 0 0 1-1.6 1.6c-1.1.4-3.8.3-5.4.3s-4.3.1-5.4-.3A2.9 2.9 0 0 1 5 18.6c-.4-1.1-.3-3.8-.3-5.4s-.1-4.3.3-5.4A2.9 2.9 0 0 1 6.6 6.2c1.1-.4 3.8-.3 5.4-.3s4.3-.1 5.4.3A2.9 2.9 0 0 1 19 7.8c.4 1.1.3 3.8.3 5.4s.1 4.3-.3 5.4z"/></svg>Instagram</a>
      <a class="social-btn" data-link="x" href="{{x}}" target="_blank" rel="noopener" aria-label="X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 2.5h3.1l-6.8 7.8 8 10.6h-6.3l-4.9-6.4-5.6 6.4H2.2l7.3-8.3L1.9 2.5h6.4l4.4 5.9 5.1-5.9zm-1.1 16.5h1.7L7.4 4.3H5.6L16.7 19z"/></svg></a>
    </div>
  </section>
</main>
<noscript><p class="noscript">The games need JavaScript and WebGL.</p></noscript>
<script type="module" src="src/hub/hub.js"></script>
</body>
</html>

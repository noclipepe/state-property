<body>
<div id="app">
  <div id="stage">
    <canvas id="view" aria-label="Game view: drag to look around"></canvas>

    <!-- in-game HUD: kept small so the scene gets the screen -->
    <div id="hud" hidden>
      <div class="hud-top">
        <div class="byline"><img src="assets/brand/avatar-160.webp" alt="" width="22" height="22">by @noclipepe</div>
        <div class="hud-btns">
          <button id="btn-sound" class="hud-btn" aria-label="Sound off" title="Sound (M)">
            <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm13.6 3 2.7-2.7-1.3-1.3-2.7 2.7-2.7-2.7-1.3 1.3 2.7 2.7-2.7 2.7 1.3 1.3 2.7-2.7 2.7 2.7 1.3-1.3z"/></svg>
          </button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart" title="Restart (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6.5 12 11V7.5a5.5 5.5 0 1 1-5.5 5.5H4a8 8 0 1 0 8-8z"/></svg>
          </button>
          <button id="btn-pause" class="hud-btn" aria-label="Pause and menu" title="Menu (Esc)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>
          </button>
        </div>
      </div>
      <button id="btn-finger" class="hud-finger" aria-label="Show him the finger" title="Show him the finger (F)"><span aria-hidden="true">🖕</span></button>
      <button id="btn-unmute" class="pill-sound" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>Tap for sound
      </button>
      <div id="hint" class="hint" hidden></div>
      <div id="subtitle" class="subtitle" aria-live="polite"></div>
      <div id="choices" class="choices" hidden role="group" aria-label="What do you say?">
        <button disabled><span class="num">1</span><span class="label"></span></button>
        <button disabled><span class="num">2</span><span class="label"></span></button>
        <button disabled><span class="num">3</span><span class="label"></span></button>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>

    <!-- loading screen (static: visible before any script has loaded); the game starts when its scene is in -->
    <section id="start" class="screen brand loading indeterminate">
      <div class="start-inner">
        <header class="studio"><img src="assets/brand/avatar-160.webp" alt="noclipepe avatar" width="34" height="34"><span>STATE PROPERTY</span></header>
        <h1 class="title">DRIVER POV</h1>
        <figure class="preview"><img src="assets/brand/card-driver.jpg" alt="Inside the pickup: the fisherman at the driver's window" width="640" height="400"></figure>
        <div class="load" aria-live="polite">
          <div class="load-bar"><div id="load-fill"></div></div>
          <div id="load-text">Loading…</div>
          <button id="btn-retry" class="btn-small" hidden>Try again</button>
        </div>
        <a class="back-link" href="./">‹ All games</a>
      </div>
    </section>

    <!-- pause / menu -->
    <section id="pause" class="screen brand panel-screen" hidden aria-labelledby="pause-title">
      <div class="panel">
        <h2 id="pause-title" class="panel-title">Paused</h2>
        <p id="pause-note" class="panel-note" hidden>The game paused while you were away.</p>
        <button id="btn-resume" class="btn-play">RESUME</button>
        <div class="row">
          <button id="btn-menu-restart" class="btn-small">Restart</button>
          <button id="btn-menu-sound" class="btn-small">Sound: on</button>
          <button id="btn-fullscreen" class="btn-small" hidden>Full screen</button>
        </div>
        <button id="btn-games" class="btn-link primary">BACK TO GAMES</button>
        <div class="social">
          <p class="social-title">NEW GAMES &amp; UPDATES</p>
          <div class="social-btns">
            <a class="social-btn" data-link="instagram" href="{{instagram}}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21 8.2c-.1-1.7-.4-3.2-1.7-4.4C18 2.5 16.5 2.2 14.8 2.1 13.1 2 10.9 2 9.2 2.1 7.5 2.2 6 2.5 4.8 3.8 3.5 5 3.2 6.5 3.1 8.2 3 9.9 3 14.1 3.1 15.8c.1 1.7.4 3.2 1.7 4.4 1.2 1.3 2.7 1.6 4.4 1.7 1.7.1 3.9.1 5.6 0 1.7-.1 3.2-.4 4.4-1.7 1.3-1.2 1.6-2.7 1.7-4.4.1-1.7.1-5.9 0-7.6zM19 18.6a2.9 2.9 0 0 1-1.6 1.6c-1.1.4-3.8.3-5.4.3s-4.3.1-5.4-.3A2.9 2.9 0 0 1 5 18.6c-.4-1.1-.3-3.8-.3-5.4s-.1-4.3.3-5.4A2.9 2.9 0 0 1 6.6 6.2c1.1-.4 3.8-.3 5.4-.3s4.3-.1 5.4.3A2.9 2.9 0 0 1 19 7.8c.4 1.1.3 3.8.3 5.4s.1 4.3-.3 5.4z"/></svg>Instagram</a>
            <a class="social-btn" data-link="x" href="{{x}}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 2.5h3.1l-6.8 7.8 8 10.6h-6.3l-4.9-6.4-5.6 6.4H2.2l7.3-8.3L1.9 2.5h6.4l4.4 5.9 5.1-5.9zm-1.1 16.5h1.7L7.4 4.3H5.6L16.7 19z"/></svg>X</a>
          </div>
        </div>
        <p class="panel-help">Drag to look around · tap an answer to say it</p>
      </div>
    </section>

    <!-- end screen -->
    <section id="end" class="screen brand end-screen" hidden aria-labelledby="end-title">
      <div class="panel">
        <h2 id="end-title" class="panel-title">Reeled in.</h2>
        <p id="end-text" class="panel-note"></p>
        <button id="btn-again" class="btn-play">PLAY AGAIN</button>
        <button id="btn-other" class="btn-link primary">CHOOSE ANOTHER POV</button>
        <div class="social">
          <p class="social-title">NEW GAMES &amp; UPDATES</p>
          <div class="social-btns">
            <a class="social-btn" data-link="instagram" href="{{instagram}}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21 8.2c-.1-1.7-.4-3.2-1.7-4.4C18 2.5 16.5 2.2 14.8 2.1 13.1 2 10.9 2 9.2 2.1 7.5 2.2 6 2.5 4.8 3.8 3.5 5 3.2 6.5 3.1 8.2 3 9.9 3 14.1 3.1 15.8c.1 1.7.4 3.2 1.7 4.4 1.2 1.3 2.7 1.6 4.4 1.7 1.7.1 3.9.1 5.6 0 1.7-.1 3.2-.4 4.4-1.7 1.3-1.2 1.6-2.7 1.7-4.4.1-1.7.1-5.9 0-7.6zM19 18.6a2.9 2.9 0 0 1-1.6 1.6c-1.1.4-3.8.3-5.4.3s-4.3.1-5.4-.3A2.9 2.9 0 0 1 5 18.6c-.4-1.1-.3-3.8-.3-5.4s-.1-4.3.3-5.4A2.9 2.9 0 0 1 6.6 6.2c1.1-.4 3.8-.3 5.4-.3s4.3-.1 5.4.3A2.9 2.9 0 0 1 19 7.8c.4 1.1.3 3.8.3 5.4s.1 4.3-.3 5.4z"/></svg>Instagram</a>
            <a class="social-btn" data-link="x" href="{{x}}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 2.5h3.1l-6.8 7.8 8 10.6h-6.3l-4.9-6.4-5.6 6.4H2.2l7.3-8.3L1.9 2.5h6.4l4.4 5.9 5.1-5.9zm-1.1 16.5h1.7L7.4 4.3H5.6L16.7 19z"/></svg>X</a>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

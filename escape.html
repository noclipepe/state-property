<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7972bd"><title>STATE PROPERTY · Fish Escape</title>
<meta name="description" content="The fish is out of the bucket. Hop past crabs and buckets along the lake shore before the fisherman hooks you back.">
<link rel="canonical" href="{{pageUrl}}"><meta property="og:type" content="website"><meta property="og:title" content="STATE PROPERTY · Fish Escape"><meta property="og:description" content="Hop for your life."><meta property="og:url" content="{{pageUrl}}"><meta property="og:image" content="{{ogImage}}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@noclipepe">
<link rel="icon" href="assets/brand/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preload" href="assets/brand/newrodin-db.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/ui/brand.css"><link rel="stylesheet" href="src/ui/escape.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script>document.documentElement.classList.toggle('touch',matchMedia('(pointer: coarse)').matches||'ontouchstart' in window);</script>
</head><body><main id="stage">
<canvas id="view" tabindex="0" aria-label="Fish Escape: tap or press up to hop forward, swipe or use the arrow keys to hop sideways or back. Avoid crabs; buckets block the way; keep moving or the fisherman hooks you."></canvas>
<div id="bars" class="esc-bars" aria-hidden="true"></div>
<div id="hud" hidden>
  <header class="esc-top">
    <a id="btn-menu" class="esc-pill" href="./">← MENU</a>
    <div class="esc-score"><b id="score" aria-live="polite">0</b><span id="best">BEST 0</span></div>
    <button id="btn-sound" class="esc-pill" aria-pressed="true">SOUND ON</button>
  </header>
  <p id="hook-warning" class="esc-warning" role="status">Hook incoming! Move off the circle</p>
  <p id="line" class="esc-line" aria-live="polite"><span id="line-who"></span><span id="line-text"></span></p>
  <p id="hint" class="esc-hint"></p>
  <p id="skip" class="esc-skip" hidden>Tap to skip</p>
</div>
<section id="start" class="esc-screen brand"><div class="esc-card">
  <p class="studio"><img src="assets/brand/avatar-160.webp" width="30" height="30" alt="">STATE PROPERTY · by @noclipepe</p>
  <h1 class="esc-title">FISH ESCAPE</h1><p class="esc-tag">Hop for your life.</p>
  <div class="load"><div class="load-bar"><div id="load-fill"></div></div><p id="load-text" aria-live="polite">Filling the bucket…</p></div>
  <button id="btn-play" class="btn-play" hidden>PLAY</button>
  <button id="btn-retry" class="btn-small" hidden>TRY AGAIN</button>
  <a class="back-link" href="./">‹ Back to games</a>
</div></section>
<section id="end" class="esc-screen esc-end" hidden><div class="esc-card">
  <p class="eyebrow">FISH ESCAPE</p>
  <h2 id="end-title" class="esc-title">Pinched!</h2>
  <p id="end-why" class="esc-why"></p>
  <p class="esc-distance"><b id="end-score">0</b><span>rows</span></p>
  <p id="end-best" class="esc-best"></p>
  <button id="btn-again" class="btn-play">PLAY AGAIN</button>
  <a id="btn-other" class="btn-link" href="./">CHOOSE ANOTHER POV</a>
</div></section>
</main><noscript><p class="noscript">Turn on JavaScript to play.</p></noscript>
<script type="module" src="src/escape/main.js"></script></body></html>
